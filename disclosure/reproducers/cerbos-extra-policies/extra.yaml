apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: groups
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          expr: hasIntersection(request.resource.attr.allowed_groups, request.principal.attr.groups)
---
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: tenant
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["*"]
      condition:
        match:
          expr: request.resource.attr.tenant == request.principal.attr.tenant
