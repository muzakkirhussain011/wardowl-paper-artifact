name: Secret scan

# Scans for secrets before the repository is made public: the whole history of this repository, and
# the tree of the tag evidence-v1 with its CI artifacts unzipped, since a scan of the history alone
# cannot read inside the zip files. Values are redacted. The report goes to the branch results/secret-scan.
on:
  push:
    branches: [main]
    paths: [.github/workflows/secret-scan.yml]
  workflow_run:
    workflows: ["Evidence tag"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks over the history and the unzipped tag
        env:
          TOKEN: ${{ github.token }}
        run: |
          set +e
          out=$(mktemp -d)
          tree=$(mktemp -d)
          docker run --rm -v "$PWD:/repo" -v "$out:/out" zricethezav/gitleaks:v8.28.0 \
            detect --source /repo --redact --report-format json --report-path /out/history.json \
            > "$out/history.txt" 2>&1
          echo "exit $?" >> "$out/history.txt"
          git fetch -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/tags/evidence-v1:refs/tags/evidence-v1
          git archive evidence-v1 | tar -x -C "$tree"
          zips=0
          for z in $(find "$tree" -name '*.zip'); do
            unzip -q -o "$z" -d "${z%.zip}" && zips=$((zips + 1))
          done
          for g in $(find "$tree" -name '*.gz'); do gunzip -q -k -f "$g"; done
          echo "zip files opened: $zips" > "$out/tree.txt"
          echo "files scanned: $(find "$tree" -type f | wc -l)" >> "$out/tree.txt"
          du -sh "$tree" >> "$out/tree.txt"
          docker run --rm -v "$tree:/tree" -v "$out:/out" zricethezav/gitleaks:v8.28.0 \
            detect --no-git --source /tree --redact --report-format json --report-path /out/tree.json \
            >> "$out/tree.txt" 2>&1
          echo "exit $?" >> "$out/tree.txt"
          for f in history tree; do
            python3 -c "import json,collections,sys; d=json.load(open('$out/$f.json')); c=collections.Counter((x['RuleID'],x['File']) for x in d); print(len(d),'findings'); [print(n,r,p) for (r,p),n in c.most_common(60)]" > "$out/$f-summary.txt"
          done
          grep -rIlE 'ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|hf_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|KGAT_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{30,}|BEGIN [A-Z ]*PRIVATE KEY' "$tree" \
            | sed "s#$tree/##" > "$out/token-patterns.txt"
          git log --all --format='%an <%ae>' | sort | uniq -c > "$out/authors.txt"
          find "$tree" -type f -size +50M | sed "s#$tree/##" > "$out/large.txt"
          set -e
          cd "$out"
          git init -q
          git checkout -q -b results/secret-scan
          git add -A
          git -c user.name="secret scan" -c user.email="scan@localhost" commit -q -m "Secret scan of $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" results/secret-scan
