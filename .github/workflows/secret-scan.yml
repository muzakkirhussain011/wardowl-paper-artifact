name: Secret scan

# Scans the whole history for secrets before the repository is made public. The report (with values
# redacted) goes to the branch results/secret-scan.
on:
  push:
    branches: [main]
    paths: [.github/workflows/secret-scan.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks over the history
        run: |
          out=$(mktemp -d)
          docker run --rm -v "$PWD:/repo" -v "$out:/out" zricethezav/gitleaks:v8.28.0 \
            detect --source /repo --redact --report-format json --report-path /out/gitleaks.json \
            > "$out/gitleaks.txt" 2>&1 && echo "exit 0" >> "$out/gitleaks.txt" || echo "exit $?" >> "$out/gitleaks.txt"
          git log --all --format='%an <%ae>' | sort | uniq -c > "$out/authors.txt"
          du -sh .git . > "$out/sizes.txt"
          find . -path ./.git -prune -o -type f -size +50M -print >> "$out/sizes.txt"
          echo "out=$out" >> "$GITHUB_ENV"
      - name: Publish the report
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$out"
          git init -q
          git checkout -q -b results/secret-scan
          git add -A
          git -c user.name="secret scan" -c user.email="scan@localhost" commit -q -m "Secret scan of $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" results/secret-scan
