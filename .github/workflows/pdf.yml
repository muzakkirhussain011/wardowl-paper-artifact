name: PDF

# Builds the paper and the study material in the cloud on every push, so nothing is compiled on the
# author's laptop. The PDF, its log, a page count, the table of contents and page images go to the
# branch results/pdf (replaced on each build), readable with git fetch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Compile the paper
        id: compile
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
      - name: Publish the build to results/pdf
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y -q poppler-utils > /dev/null
          out=$(mktemp -d)
          for f in main.pdf main.log main.aux main.blg; do
            [ -f "paper/$f" ] && cp "paper/$f" "$out/" || true
          done
          {
            echo "commit: $GITHUB_SHA"
            echo "compile outcome: ${{ steps.compile.outcome }}"
            grep -E "Output written on" paper/main.log || true
            echo "--- warnings ---"
            grep -nE "LaTeX Warning|Package .* Warning|Overfull|Float too large|Missing character|^!" paper/main.log | head -200 || true
            echo "--- bibtex ---"
            grep -E "^Warning|^I couldn't|error message" paper/main.blg | head -50 || true
          } > "$out/warnings.txt"
          if [ -f paper/main.pdf ]; then
            pdfinfo paper/main.pdf > "$out/pdfinfo.txt"
            mkdir "$out/pages"
            pdftoppm -r 60 -png paper/main.pdf "$out/pages/p"
          fi
          # The arXiv source package: arXiv publishes the source, so comments are stripped. The
          # stripped package is compiled again, without BibTeX, and must give the same text.
          if [ -f paper/main.bbl ]; then
            pip install -q arxiv-latex-cleaner==1.0.8
            pkg=$(mktemp -d)
            cp -r paper "$pkg/paper"
            rm -f "$pkg"/paper/main.{pdf,aux,log,blg,fls,fdb_latexmk,out}
            (cd "$pkg" && arxiv_latex_cleaner paper --keep_bib)
            rm -f "$pkg"/paper_arXiv/*.bib
            mkdir -p "$out/arxiv"
            tar -C "$pkg/paper_arXiv" -czf "$out/arxiv/arxiv-source.tar.gz" .
            tar -tzf "$out/arxiv/arxiv-source.tar.gz" | sort > "$out/arxiv/files.txt"
            {
              echo "percent signs starting a comment line:"
              grep -rlE '^[[:space:]]*%[^%]' "$pkg/paper_arXiv" | wc -l
              echo "evidence/ or plan/ paths left in the source:"
              grep -rnE 'evidence/|plan/|PREREG_' "$pkg/paper_arXiv" | wc -l
              echo "TBD markers left:"
              grep -rno '\\tbd{' "$pkg/paper_arXiv/sections" | wc -l
            } > "$out/arxiv/checks.txt"
            # TeX Live 2025 is arXiv's default (info.arxiv.org/help/submit_tex.html, read 2026-10-30).
            # Its image does not fit on the runner beside the compile action's image.
            docker system prune -af > /dev/null 2>&1 || true
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
            df -h / | tail -1 | awk '{print "disk free before the image: " $4}' >> "$out/arxiv/checks.txt"
            docker run --rm -v "$pkg/paper_arXiv:/w" -w /w texlive/texlive:TL2025-historic \
              sh -c 'pdflatex --version | head -1; pdflatex -interaction=nonstopmode main.tex >/dev/null; pdflatex -interaction=nonstopmode main.tex >/dev/null; pdflatex -interaction=nonstopmode main.tex | tail -3' \
              >> "$out/arxiv/checks.txt" 2>&1 || true
            if [ -f "$pkg/paper_arXiv/main.pdf" ]; then
              pdftotext -layout paper/main.pdf "$pkg/a.txt"
              pdftotext -layout "$pkg/paper_arXiv/main.pdf" "$pkg/b.txt"
              echo "pages: $(pdfinfo "$pkg/paper_arXiv/main.pdf" | awk '/^Pages/{print $2}')" >> "$out/arxiv/checks.txt"
              echo "text lines differing from the main build: $(diff "$pkg/a.txt" "$pkg/b.txt" | grep -c '^[<>]')" >> "$out/arxiv/checks.txt"
              diff "$pkg/a.txt" "$pkg/b.txt" > "$out/arxiv/text-diff.txt" || true
              # The same comparison ignoring layout: one word per line, spaces and line breaks dropped.
              tr -s '[:space:]' '\n' < "$pkg/a.txt" > "$pkg/a.words"
              tr -s '[:space:]' '\n' < "$pkg/b.txt" > "$pkg/b.words"
              diff "$pkg/a.words" "$pkg/b.words" > "$out/arxiv/word-diff.txt" || true
              echo "words: $(wc -l < "$pkg/a.words") and $(wc -l < "$pkg/b.words"); differing word lines: $(grep -c '^[<>]' "$out/arxiv/word-diff.txt")" >> "$out/arxiv/checks.txt"
            else
              echo "the stripped package did not compile" >> "$out/arxiv/checks.txt"
            fi
          fi
          cd "$out"
          git init -q
          git checkout -q -b results/pdf
          git add -A
          git -c user.name="pdf build" -c user.email="pdf@localhost" commit -q -m "PDF of $GITHUB_SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" results/pdf
      - name: Fail on a failed compile or undefined references
        run: |
          [ "${{ steps.compile.outcome }}" = "success" ] || { echo "::error::the paper did not compile"; exit 1; }
          if grep -qE "There were undefined (references|citations)|(Citation|Reference) .* undefined" paper/main.log; then
            echo "::error::undefined references or citations in main.log"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-pdf
          path: paper/main.pdf
          retention-days: 30
